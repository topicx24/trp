
name: CAN TV Playlist Güncelle

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

  push:
    paths:
      - "sources.txt"
      - "categories.json"
      - "config.json"
      - "build.py"
      - "update_named_channels.py"
      - "data/kanal_kaynaklari.m3u"

permissions:
  contents: write

# Aynı workflow'un iki kopyasının aynı anda çalışmasını engeller.
concurrency:
  group: playlist-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1 - REPOSITORY
      # --------------------------------------------------
      - name: Depoyu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # --------------------------------------------------
      # 2 - PYTHON
      # --------------------------------------------------
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --------------------------------------------------
      # 3 - GEREKSINIMLER
      # --------------------------------------------------
      - name: Gereksinimler
        run: |
          python -m pip install --upgrade pip

      # --------------------------------------------------
      # 4 - KANAL KAYNAKLARINI GÜNCELLE
      # --------------------------------------------------
      - name: Kanal kaynaklarını güncelle
        run: |
          python update_named_channels.py

      # --------------------------------------------------
      # 5 - PLAYLIST OLUŞTUR
      # --------------------------------------------------
      - name: Playlist oluştur
        run: |
          python build.py

      # --------------------------------------------------
      # 6 - GIT AYARLARI
      # --------------------------------------------------
      - name: Git ayarları
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # --------------------------------------------------
      # 7 - DEĞİŞİKLİKLERİ GITHUB'A GÖNDER
      # --------------------------------------------------
      - name: Değişiklikleri kaydet
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo " CAN TV PLAYLIST GÜNCELLEME"
          echo "========================================"

          # ------------------------------------------------
          # Sadece otomatik oluşturulan dosyaları ekle
          # ------------------------------------------------
          git add playlist.m3u
          git add data/kanal_kaynaklari.m3u
          git add data/kanal_raporu.json

          # ------------------------------------------------
          # Değişiklik yoksa çık
          # ------------------------------------------------
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
            exit 0
          fi

          # ------------------------------------------------
          # Geçici commit oluştur
          # ------------------------------------------------
          git commit -m "chore: update playlist"

          # ------------------------------------------------
          # PUSH RETRY
          #
          # GitHub'da başka bir değişiklik oluşursa
          # tekrar güncel main alınır ve otomatik üretilen
          # dosyalar tekrar commit edilerek push denenir.
          # ------------------------------------------------

          MAX_RETRIES=5
          RETRY=1

          while [ "$RETRY" -le "$MAX_RETRIES" ]; do

            echo ""
            echo "----------------------------------------"
            echo "Push denemesi: $RETRY / $MAX_RETRIES"
            echo "----------------------------------------"

            # GitHub'daki son main'i al
            git fetch origin main

            # Local branch'i remote main ile eşitle
            git reset --soft origin/main

            # Otomatik oluşturulan dosyaları tekrar ekle
            git add playlist.m3u
            git add data/kanal_kaynaklari.m3u
            git add data/kanal_raporu.json

            # Değişiklik varsa commit et
            if ! git diff --cached --quiet; then
              git commit -m "chore: update playlist"
            fi

            # Push
            if git push origin HEAD:main; then
              echo ""
              echo "========================================"
              echo " PLAYLIST BAŞARIYLA GÜNCELLENDİ"
              echo "========================================"
              exit 0
            fi

            echo ""
            echo "Push başarısız oldu."
            echo "GitHub'daki branch tekrar alınacak..."

            # Biraz bekle
            sleep $((RETRY * 3))

            RETRY=$((RETRY + 1))
          done

          echo ""
          echo "========================================"
          echo " HATA: PUSH BAŞARISIZ"
          echo "========================================"

          exit 1
